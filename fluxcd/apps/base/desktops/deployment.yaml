apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktops
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desktops
  template:
    metadata:
      labels:
        app: desktops
    spec:
      serviceAccount: desktops
      containers:
        - name: desktops
          image: timotheeren/kubepods-desktops:sha-c4c37af62c6a3653c303cf4aa814746d38e51193
          ports:
            - containerPort: 50052
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: desktops-postgres-cluster-app
                  key: uri
            - name: USERS_HOST
              value: "http://users:50051"
