apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktops
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desktops
  template:
    metadata:
      labels:
        app: desktops
    spec:
      serviceAccount: desktops
      containers:
        - name: desktops
          image: timotheeren/kubepods-desktops:sha-a0677a2c4a8af4518c367fd3f6485862e93d0fe0
          ports:
            - containerPort: 50052
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: desktops-postgres-cluster-app
                  key: uri
