apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktops
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desktops
  template:
    metadata:
      labels:
        app: desktops
    spec:
      serviceAccount: desktops
      containers:
        - name: desktops
          image: timotheeren/kubepods-desktops:sha-6a01f3122e03db5b085d128be8885ccb5520e4d1
          ports:
            - containerPort: 50052
              name: grpc
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: desktops-postgres-cluster-app
                  key: uri
            - name: USERS_HOST
              value: "http://users:50051"
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
