apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktops
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desktops
  template:
    metadata:
      labels:
        app: desktops
    spec:
      containers:
        - name: desktops
          image: timotheeren/kubepods-desktops:sha-4616dc658d250cf216ea677b52ec064cb994366c
          ports:
            - containerPort: 50051
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: desktops-postgres-cluster-app
                  key: uri
