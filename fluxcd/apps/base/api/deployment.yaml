apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: timotheeren/kubepods-api:sha-fa29d9736349f9d912ede8a7b964b88271557eaf
          ports:
            - containerPort: 3001
          env:
            - name: USERS_HOST
              value: "http://users:50051"
            - name: DESKTOPS_HOST
              value: "http://desktops:50051"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
