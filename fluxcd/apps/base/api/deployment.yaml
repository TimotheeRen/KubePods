apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: timotheeren/kubepods-api:sha-4873f16e276690fb548b9b5f94e9add70c049d2a
          ports:
            - containerPort: 3001
          env:
            - name: USERS_HOST
              value: "http://users:50051"

