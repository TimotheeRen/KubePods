apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: timotheeren/kubepods-api:sha-fea68c52bae9b5d1ce0b0118c6fbe2cec3d7e2cc
          ports:
            - containerPort: 3001
          env:
            - name: USERS_HOST
              value: "http://users:50051"
