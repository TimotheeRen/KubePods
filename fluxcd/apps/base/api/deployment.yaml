apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: timotheeren/kubepods-api:sha-8103db4ea72da179ed1e4e98280ac48e17a697ee
          ports:
            - containerPort: 3001
              name: http
            - containerPort: 9000
              name: metrics
          env:
            - name: USERS_HOST
              value: "http://users:50051"
            - name: DESKTOPS_HOST
              value: "http://desktops:50051"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
