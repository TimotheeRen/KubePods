apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: timotheeren/kubepods-api:sha-3c0a768a71c0f4de78d778f29e58910dbea47be4
          ports:
            - containerPort: 3001
          env:
            - name: USERS_HOST
              value: "http://users:50051"

