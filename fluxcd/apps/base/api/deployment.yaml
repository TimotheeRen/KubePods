apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: timotheeren/kubepods-api:sha-3cf9230cae18d407d2016aff8daacaded5a5e3d1
          ports:
            - containerPort: 3001
          env:
            - name: USERS_HOST
              value: "http://users:50051"
