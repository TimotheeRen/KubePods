apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: timotheeren/kubepods-api:sha-671782f46d4ca30768bc8bb9c496d89c5de039dc
          ports:
            - containerPort: 3001
          env:
            - name: USERS_HOST
              value: "http://users:50051"
            - name: DESKTOPS_HOST
              value: "http://desktops:50051"
