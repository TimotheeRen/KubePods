apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: timotheeren/kubepods-api:sha-3f81a471e606b7860b8fdd611c326829a9dbc974
          ports:
            - containerPort: 3001
              name: http
            - containerPort: 9000
              name: metrics
          env:
            - name: USERS_HOST
              value: "http://users:50051"
            - name: DESKTOPS_HOST
              value: "http://desktops:50051"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
