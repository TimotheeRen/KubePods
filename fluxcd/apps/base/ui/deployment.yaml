apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-14592a4d0fc3f76e221e908b7de69b8eb2392814
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
