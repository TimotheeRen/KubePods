apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-f47f886889c6b0e331aaa6b9d4feabc3d843dd88
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api"
