apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-ba418f618f5f8f493f63e2039afa5406d95a9852
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
