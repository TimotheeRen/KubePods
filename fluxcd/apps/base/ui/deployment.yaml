apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-e54650eb854625f2fc67968b71cbf90c9c1a8a6d
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
