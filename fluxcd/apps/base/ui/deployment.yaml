apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-b1c0fade68ac8f553f4ff43d5da2a2b638a0c909
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
