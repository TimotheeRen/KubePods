apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-7d0518291e07cf0f7fdfc839b4e60d5986b28b9b
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
