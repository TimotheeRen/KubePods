apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-e13108802d7f6e1c4dded61d4a08ebe895eaeaa5
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
