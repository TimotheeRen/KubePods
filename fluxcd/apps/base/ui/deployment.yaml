apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-d08567a299034ef1adc4faba0378550ad3e1e07f
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
