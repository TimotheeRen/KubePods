apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-82f506126f3b02ca39fe3b83d89dd14240de2790
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api"
