apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-5b4b0baff6d11d2134360183e3a2039f6169c28c
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
