apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-91fe1833ca10dd8f2f5d44290f4ae77ec2e5227b
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
