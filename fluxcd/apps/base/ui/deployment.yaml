apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-ae45007a3f5de839fbf59182837adc5f867e9602
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
