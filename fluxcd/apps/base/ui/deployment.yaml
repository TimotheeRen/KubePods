apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-7b958f6958d1e052c1311fc36755ef63def1bfc8
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
