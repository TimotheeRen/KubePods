apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-b63d9624eda2cd7c5d33e11524d3a36a16e03dda
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
