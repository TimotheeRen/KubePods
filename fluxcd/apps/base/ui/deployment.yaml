apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-135db189c30e9c99701c3718a8e9b57351514874
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
