apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-4802f15b1c60123468d33339bccdb5485d78fa3e
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
