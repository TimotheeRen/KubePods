apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-b707f5dd0e47d82a4d62efb0e7a16af2bc8cc165
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
