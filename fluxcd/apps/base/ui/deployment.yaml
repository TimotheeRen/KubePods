apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-b97ffb7e8bf67afa2f7f5a137d36e8a1120c74b3
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
