apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-84348baf2c92e86d2613fe46409b9e9526125a21
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
