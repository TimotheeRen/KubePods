apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-75f05b7538f27e792f5a8b2db999dfa5a3044f09
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
