apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-cf90a8a318a456227e68b260f926bee516b042a8
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
