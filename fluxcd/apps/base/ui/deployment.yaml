apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-671782f46d4ca30768bc8bb9c496d89c5de039dc
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
