apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-201d41c0d78a8f53425c95947d374dd4f6d13f65
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
