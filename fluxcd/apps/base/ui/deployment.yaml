apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-416b8cf4221a40ee8f5d891f94da2d8bab6f6211
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
