apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-748d0d672e767d4440d989943148e4780e0dd61f
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
