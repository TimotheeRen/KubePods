apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-d0d0c20ad2e9ffcf1f20c699ad912350b8a01a0d
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
