apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-0d754e138ccde2180cd7d90e6338469515a6f06b
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
