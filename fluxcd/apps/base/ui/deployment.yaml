apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-2d4e0bebeac21e63b6571a901a71b41ce11acb5b
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
