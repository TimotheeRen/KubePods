apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: timotheeren/kubepods-ui:sha-27c1a73b4a815a0b77314f0a881c51676af1aaa5
          ports:
            - containerPort: 3000
          env:
            - name: API_HOST
              value: "http://api:3001"
