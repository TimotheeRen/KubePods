apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: timotheeren/kubepods-users:sha-9e573e3b68500d6af17f6db672add55c3e2dcef9
          ports:
            - containerPort: 3001
