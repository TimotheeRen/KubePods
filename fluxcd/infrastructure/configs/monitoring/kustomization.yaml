apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api-service-monitor.yaml

configMapGenerator:
  - name: red-dashboard
    namespace: monitoring
    files:
      - dashboards/red.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Application"

  - name: alloy-config
    namespace: monitoring
    files:
      - config.alloy=alloy/config.alloy
    options:
      disableNameSuffixHash: true
