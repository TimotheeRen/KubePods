apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasSchema
metadata:
  name: desktops-schema
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/depends-on: postgresql.cnpg.io/Cluster/default/desktops-postgres-cluster
spec:
  urlFrom:
    secretKeyRef:
      name: desktops-postgres-cluster-app
      key: uri
  schema:
    configMapKeyRef:
      name: desktops-schema-config
      key: desktops-schema.hcl
