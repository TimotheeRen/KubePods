apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-loki
  namespace: monitoring
spec:
  url: https://grafana-community.github.io/helm-charts
  interval: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart:
      version: "18.7.1"
      sourceRef:
        kind: HelmRepository
        name: loki
        namespace: monitoring
