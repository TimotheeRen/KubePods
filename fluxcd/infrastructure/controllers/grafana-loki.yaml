apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-loki
  namespace: monitoring
spec:
  url: https://grafana-community.github.io/helm-charts
  interval: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "18.7.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-loki
        namespace: monitoring
  values:
    loki:
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-08-03"
            object_store: filesystem
            store: tsdb
            schema: v13
            index:
              prefix: index_
              period: 24h
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 5Gi
