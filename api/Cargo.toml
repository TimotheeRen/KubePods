[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
axum = { version = "0.8.9", features = ["json"] }
tonic-build = "0.14.6"
tonic = { version = "0.14.6", features = ["channel"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
prost = "0.14.3"
tonic-prost = "0.14.6"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower-http = { version = "0.6.11", features = ["cors"] }
metrics-exporter-prometheus = "0.18.3"
metrics = "0.24.6"

[build-dependencies]
tonic-prost-build = "0.14.6"
