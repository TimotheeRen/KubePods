syntax = "proto3";

package provisioning;

service ProvisioningService {
  rpc CreateDesktop(CreateDesktopRequest) returns (CreateDesktopResponse);
  rpc GetDesktops(GetDesktopsRequest) returns (GetDesktopResponse);
}

message Desktop {
  string name = 1;
  string distribution = 2;
  string desktop_environment = 3;
}

message CreateDesktopRequest {
  string name = 1;
  string distribution = 2;
  string desktop_environment = 3;
  string username = 4;
}

message CreateDesktopResponse {}

message GetDesktopsRequest {
  string username = 1;
}

message GetDesktopResponse {
  repeated Desktop desktops = 1;
}
