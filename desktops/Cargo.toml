[package]
name = "desktops"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { version = "0.14.6", features = ["router"] }
tokio = { version = "1.52.2", features = ["rt-multi-thread"] }
prost = "0.14.3"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
tonic-prost = "0.14.6"
dotenvy = "0.15.7"
async-trait = "0.1.89"
thiserror = "2.0.18"
serde = "1.0.228"
serde_json = "1.0.150"
kube = { version = "3.1.0", features = ["derive"] }
k8s-openapi = { version = "0.27.1", features = ["v1_35"] }
schemars = "1.2.1"
sha2 = "0.11.0"
hex = "0.4.3"
tokio-stream = "0.1.18"

[build-dependencies]
tonic-prost-build = "0.14.6"
